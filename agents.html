        document.addEventListener('DOMContentLoaded', () => {

        function populateFilters() {
            const majors = [...new Set(agentsData.map(agent => agent.التخصص))].sort((a, b) => a.localeCompare(b, 'ar'));
            const levels = [...new Set(agentsData.map(agent => agent.الفرقة_المستوى))].sort((a, b) => {
                const order = ['اعدادي', '1', '2', 'قديمة 3', '3', '4', 'غير محدد'];
                const indexA = order.indexOf(a);
                const indexB = order.indexOf(b);
                if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                if (indexA !== -1) return -1;
                if (indexB !== -1) return 1;
                return a.localeCompare(b, 'ar');
            });

            const majorFilter = document.getElementById('major-filter');
            const levelFilter = document.getElementById('level-filter');

            majors.forEach(major => {
                const option = document.createElement('option');
                option.value = major;
                option.textContent = major;
                majorFilter.appendChild(option);
            });

            levels.forEach(level => {
                const option = document.createElement('option');
                option.value = level;
                option.textContent = level;
                levelFilter.appendChild(option);
            });
        }

        function filterAgents() {
            const searchInput = document.getElementById('search-input').value.toLowerCase().trim();
            const selectedMajor = document.getElementById('major-filter').value;
            const selectedLevel = document.getElementById('level-filter').value;
            const agentsList = document.getElementById('agents-list');
            const noResults = document.getElementById('no-results');
            const heroSection = document.getElementById('hero-title-section'); // New reference

            const filteredAgents = agentsData.filter(agent => {
                // 1. Filter by Major
                const majorMatch = !selectedMajor || agent.التخصص === selectedMajor;

                // 2. Filter by Level
                const levelMatch = !selectedLevel || agent.الفرقة_المستوى === selectedLevel;

                // 3. Filter by Search (Name, Phone, or Facebook Account if present)
                const searchMatch = !searchInput || 
                                    agent.الاسم.toLowerCase().includes(searchInput) ||
                                    (agent.رقم_الهاتف && agent.رقم_الهاتف.includes(searchInput)) ||
                                    (agent.اكونت_الفيسبوك && agent.اكونت_الفيسبوك.toLowerCase().includes(searchInput));

                return majorMatch && levelMatch && searchMatch;
            });
            
            if (searchInput || selectedMajor || selectedLevel) {
                heroSection.classList.add('hidden');
            } else {
                heroSection.classList.remove('hidden');
            }

            // Render the results
            agentsList.innerHTML = '';
            if (filteredAgents.length > 0) {
                filteredAgents.forEach(agent => {
                    agentsList.innerHTML += createAgentCard(agent);
                });
                agentsList.classList.remove('hidden');
                noResults.classList.add('hidden');
            } else {
                agentsList.classList.add('hidden');
                noResults.classList.remove('hidden');
            }

            lucide.createIcons();
        }

                    </div>

                            <i data-lucide="briefcase" class="w-5 h-5 text-gold-500 ml-2 flex-shrink-0"></i>
                            <span class="font-semibold ml-1">التخصص:</span>
                            <span class="font-medium text-dark-green-700">${agent.التخصص}</span>
                        </div>
                        <div class="flex items-center text-base sm:text-lg">

                            <span class="font-semibold ml-1">المستوى:</span>
                            <span class="font-medium text-dark-green-700">${agent.الفرقة_المستوى}</span>
                        </div>
                    </div>

                    <div class="mt-4 pt-4 border-t border-gray-100">
                        ${isPhone ? `
                            <div class="bg-cream-100/70 p-4 rounded-lg flex flex-col items-center justify-center border-2 border-gold-500/30 space-y-3">
                                <!-- الرقم فوق زر النسخ مباشرة -->
                                <span dir="ltr" class="font-mono text-xl sm:text-2xl tracking-widest text-dark-green-700 whitespace-nowrap overflow-hidden">${contactInfo.display}</span>
                                
                                <button onclick="copyToClipboard(this, '${contactInfo.value}')" 
                                        class="w-full bg-gold-500 text-dark-green-800 px-4 py-2 rounded-full font-semibold text-base hover:bg-gold-600 transition-colors shadow-md flex items-center justify-center transform hover:scale-[1.02]">
                                    <i data-lucide="${contactInfo.icon}" class="w-5 h-5 ml-2"></i>
                                    <span>نسخ الرقم</span>
                                </button>
                            </div>
                        ` : `
                            <div class="bg-cream-100/70 p-3 rounded-lg flex flex-col items-center border-2 border-gold-500/30 text-sm font-medium text-gray-700 mb-3">
                                <span>يتم استخدام رابط فيسبوك لعدم توفر رقم هاتف.</span>
                            </div>
                            <a href="${contactInfo.value}" target="_blank" rel="noopener noreferrer"
                               class="block text-center bg-dark-green-700 text-gold-500 px-4 py-3 rounded-full font-bold text-base hover:bg-dark-green-800 transition-colors shadow-lg transform hover:scale-[1.02] flex items-center justify-center border-2 border-gold-500">
                                <i data-lucide="${contactInfo.icon}" class="w-5 h-5 ml-2"></i>
                                ${contactInfo.actionText}
                            </a>
                        `}
                    </div>
                </div>
            `;
        }

        
        function copyToClipboard(btnOrText, maybeText) {
            let button = null;
            let text = '';
            if (typeof btnOrText === 'string') {
                text = btnOrText;
            } else {
                button = btnOrText; // the button element
                text = maybeText || '';
            }

            const el = document.createElement('textarea');
            el.value = text;
            el.setAttribute('readonly', '');
            el.style.position = 'absolute';
            el.style.left = '-9999px';
            document.body.appendChild(el);
            el.select();
            try {
                document.execCommand('copy');
                showCopyToast(); 

                if (button) {
                    if (!button.dataset._origHtml) button.dataset._origHtml = button.innerHTML;
                    button.innerHTML = '<span>تم النسخ</span>';
                    button.disabled = true;
                    setTimeout(() => {
                        if (button.dataset._origHtml) button.innerHTML = button.dataset._origHtml;
                        button.disabled = false;
                    }, 2000);
                }
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
            }
            document.body.removeChild(el);
        }

        function showCopyToast() {
            const toast = document.getElementById('copy-toast');
            if (toast) {
                if (toastTimeout) {
                    clearTimeout(toastTimeout);
                }


                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-5', 'hidden'); 

                void toast.offsetWidth; 
                
                toast.classList.remove('hidden');

                setTimeout(() => {
                    toast.classList.remove('opacity-0', 'translate-y-5');
                    toast.classList.add('opacity-100', 'translate-y-0');
                }, 10); 

                toastTimeout = setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', 'translate-y-5');
                }, 2500);
            }
        }
    </script>
</body>
</html>
